version: 0.2
# Updated buildspec for proper terraform directory handling

phases:
  install:
    commands:
      - echo "Installing Terraform v1.4.6"
      - curl -Lo terraform.zip https://releases.hashicorp.com/terraform/1.4.6/terraform_1.4.6_linux_amd64.zip
      - unzip -o terraform.zip -d /usr/local/bin
      - chmod +x /usr/local/bin/terraform
      - terraform --version

  pre_build:
    commands:
      - echo "Initializing Terraform"
      - cd terraform
      - echo "Checking for state backend issues..."
      - |
        if ! terraform init -input=false -backend-config=backend.hcl 2>&1; then
          echo "⚠️  Terraform init failed, attempting to fix state backend..."
          chmod +x fix_state_backend.sh
          ./fix_state_backend.sh
          echo "🔄 Retrying terraform init..."
          terraform init -input=false -backend-config=backend.hcl
        fi

  build:
    commands:
      - echo "Formatting & Validating"
      - terraform fmt
      - terraform validate
      - echo "Planning"
      - terraform plan -out=plan.tfplan -no-color

artifacts:
  base-directory: terraform
  files:
    - plan.tfplan

cache:
  paths:
    - "~/.terraform.d/plugin-cache/*"
