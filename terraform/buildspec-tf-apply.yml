version: 0.2

env:
  variables:
    PLAN_FILE: "$CODEBUILD_SRC_DIR_PlanOutput/plan.tfplan"

phases:
  install:
    commands:
      - echo "Installing Terraform v1.4.6"
      - curl -Lo terraform.zip https://releases.hashicorp.com/terraform/1.4.6/terraform_1.4.6_linux_amd64.zip
      - unzip -o terraform.zip -d /usr/local/bin
      - chmod +x /usr/local/bin/terraform
      - terraform --version

  pre_build:
    commands:
      - echo "Retrieving the plan artifact"
      - echo "DEBUG: PLAN_FILE=$PLAN_FILE"
      - ls -R "$CODEBUILD_SRC_DIR_PlanOutput"
      - test -f "$PLAN_FILE" || { echo "ERROR: $PLAN_FILE not found"; exit 1; }
      - cp "$PLAN_FILE" terraform/
      - echo "Initializing Terraform with remote state"
      - cd terraform
      - terraform init -input=false -backend-config=backend.hcl -reconfigure

  build:
    commands:
      - echo "Applying Terraform"
      - terraform apply -auto-approve -no-color plan.tfplan

cache:
  paths:
    - "~/.terraform.d/plugin-cache/*"
